# Prefix ----------------------------------------------------------------------

unbind C-b
set -g prefix '^'
bind '^' send-prefix

# Terminal --------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:focus:hyperlinks:overline:sync:usstyle"
set -g focus-events on
set -g extended-keys on
set -g set-clipboard on
set -g allow-passthrough on
set -g escape-time 0
set -g repeat-time 400

# Sessions --------------------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g history-limit 100000
set -g mouse on
set -g status-keys vi
setw -g mode-keys vi

# Windows and panes -----------------------------------------------------------

unbind c
bind c new-window -c "#{pane_current_path}"

unbind '"'
unbind %
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r '<' swap-pane -U
bind -r '>' swap-pane -D
bind z resize-pane -Z
bind x kill-pane

# Move between shell panes directly. When Neovim is active, forward the key;
# Neovim moves internally first and selects the adjacent tmux pane at an edge.
is_nvim='#{m/r:(^|/)(n?vim?)(diff)?$,#{pane_current_command}}'
bind -n C-h if-shell -F "$is_nvim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell -F "$is_nvim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell -F "$is_nvim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell -F "$is_nvim" 'send-keys C-l' { if-shell -F '#{pane_at_right}' 'send-keys C-l' 'select-pane -R' }

# Switch windows without reaching for the prefix.
bind -n M-H previous-window
bind -n M-L next-window
bind -n M-k switch-client -p
bind -n M-j switch-client -n
bind '(' switch-client -p
bind ')' switch-client -n
bind '`' switch-client -l

# Copy mode -------------------------------------------------------------------

bind '[' copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

# Workflows -------------------------------------------------------------------

unbind ':'
unbind ','
bind ':' display-popup -E -T " tmux command " -w 70% -h 9 "~/.config/tmux/scripts/command-prompt"
bind ',' display-popup -E -T " Rename window " -w 60% -h 9 "~/.config/tmux/scripts/rename-window"
bind r source-file "#{config_files}" \; display-message "tmux config reloaded"
bind f display-popup -E -w 80% -h 70% "~/.config/tmux/scripts/sessionizer"
bind g display-popup -E -w 95% -h 90% -d "#{pane_current_path}" lazygit
bind q display-panes -d 1500
bind s choose-tree -Zw

# Status line -----------------------------------------------------------------

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 80
set -g status-left ' #S '
set -g status-right '#{?client_prefix, PREFIX ,}#{?pane_synchronized, SYNC ,} #{b:pane_current_path}  %H:%M '
set -g window-status-separator ''
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g pane-border-lines simple
set -g popup-border-lines rounded
set -g message-command-style bold

# Match Ghostty's automatic system theme when a client attaches or regains focus.
set-hook -g client-attached 'run-shell -b "~/.config/tmux/scripts/theme dark-or-light"'
set-hook -g client-focus-in 'run-shell -b "~/.config/tmux/scripts/theme dark-or-light"'
run-shell -b "~/.config/tmux/scripts/theme dark-or-light"
